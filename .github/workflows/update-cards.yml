name: Refresh profile SVG cards

on:
  schedule:
    - cron: '17 3 * * *' # daily, 08:47 India time
  workflow_dispatch:
  push:
    paths:
      - scripts/render_readme_cards.py
      - .github/workflows/update-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-svg-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer and fonts
        run: |
          python -m pip install --disable-pip-version-check 'fonttools[woff]>=4.55,<6'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-inter fonts-liberation
      - name: Fetch real contribution calendar
        env:
          GITHUB_USERNAME: Code-Theory
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/render_readme_cards.py --refresh --refresh-only
      - name: Render SVG cards
        run: python scripts/render_readme_cards.py
      - name: Commit cards and JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/ data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub profile activity cards'
            git push
          fi
